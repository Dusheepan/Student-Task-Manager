groups:
  - name: demo-service
    rules:
      - alert: ServiceDown
        expr: up{job="backend"} == 0
        for: 0s
        labels:
          severity: critical
          service: student-task-manager
        annotations:
          summary: Student Task Manager API is unavailable
          description: Prometheus has been unable to scrape the API for more than zero seconds.

      - alert: HighCPUUsage
        expr: 100 * (1 - min by (instance) (rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[1m]))) > 80
        for: 30s
        labels:
          severity: warning
          service: student-task-manager
        annotations:
          summary: A host CPU core is highly utilized
          description: At least one host CPU core has exceeded 80% utilization over a one-minute rate window for 30 seconds.

      - alert: HighMemoryUsage
        expr: 100 * (1 - node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) > 85
        for: 30s
        labels:
          severity: warning
          service: student-task-manager
        annotations:
          summary: Host memory usage is high
          description: Host memory usage has exceeded 85% for thirty seconds.

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{job="backend", status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{job="backend"}[5m])), 0.001) > 0.05
        for: 2m
        labels:
          severity: warning
          service: student-task-manager
        annotations:
          summary: Student Task Manager API has a high HTTP 5xx rate
          description: More than 5% of API responses have been HTTP 5xx for two minutes.

      # MongoDB database connection failure
      - alert: DatabaseDown
        expr: mongodb_up == 0
        for: 2s
        labels:
          severity: critical
          service: student-task-manager
        annotations:
          summary: MongoDB database is unavailable
          description: MongoDB exporter cannot establish a connection to the database.

      # MongoDB exporter itself is unavailable
      - alert: DatabaseExporterDown
        expr: up{job="mongodb"} == 0
        for: 2s
        labels:
          severity: critical
          service: student-task-manager
        annotations:
          summary: MongoDB exporter is unavailable
          description: Prometheus cannot scrape MongoDB exporter metrics.
